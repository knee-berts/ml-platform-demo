{{- range .Values.workers }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: {{ .multikueueClusterName }}
  labels:
    # Read by least-disruption-dispatcher to break ties when eviction scores
    # are equal (higher value = preferred). Defaults to 0 if unset.
    dispatcher.kueue.x-k8s.io/priority: {{ .dispatcherPriority | default 0 | quote }}
spec:
  clusterSource:
    clusterProfileRef:
      name: {{ .clusterProfileName }}
{{- end }}
