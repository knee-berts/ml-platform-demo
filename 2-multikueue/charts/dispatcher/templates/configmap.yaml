apiVersion: v1
kind: ConfigMap
metadata:
  name: least-disruption-dispatcher-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    priorityWeights:
      {{- range $k, $v := .Values.priorityWeights }}
      {{ $k }}: {{ $v }}
      {{- end }}
    resourceName: "nvidia.com/gpu"
    flavorName: {{ .Values.flavorName | quote }}
    clusterQueueName: {{ .Values.clusterQueueName | quote }}
    nominationTimeoutSeconds: {{ .Values.nominationTimeoutSeconds }}
    inFlightTTLSeconds: {{ .Values.inFlightTTLSeconds }}
    requeueDelaySeconds: {{ .Values.requeueDelaySeconds }}
    cleanupPeriodSeconds: {{ .Values.cleanupPeriodSeconds }}
