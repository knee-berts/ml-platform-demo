# One-shot Cloud Build job that downloads Llama 3.1 8B from HuggingFace and
# pushes it to the user's model-weights GCS bucket (created by the
# 1-infrastructure stack).
#
# Prerequisites:
#   1. A Secret Manager secret named `hf-token` exists with the user's HF
#      access token. Create with:
#        printf "$HF_TOKEN" | gcloud secrets create hf-token --data-file=- --project=<project>
#   2. The default Cloud Build SA (<project-num>@cloudbuild.gserviceaccount.com)
#      has roles/secretmanager.secretAccessor on the hf-token secret and
#      roles/storage.objectAdmin on the model-weights bucket. install.sh
#      grants both.
#   3. The model-weights bucket exists (1-infrastructure creates it).
#   4. The HF account this token is associated with has accepted the
#      meta-llama/Llama-3.1-8B-Instruct license on HuggingFace.
#
# Run:
#   gcloud builds submit --no-source \
#     --config 3-multi-cluster-inference-gateway/docker/weights-uploader/cloudbuild.yaml \
#     --project=<project>
substitutions:
  _MODEL_ID: meta-llama/Llama-3.1-8B-Instruct
  _LOCAL_DIR: /workspace/model
  _BUCKET_NAME: ""

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/hf-token/versions/latest
      env: HF_TOKEN

steps:
  - name: python:3.11-slim
    entrypoint: bash
    secretEnv:
      - HF_TOKEN
    env:
      # HF can stall mid-download with no progress for many minutes. These
      # tunables make download progress visible and fail fast so retries help.
      - HF_HUB_ENABLE_HF_TRANSFER=1   # use the hf_transfer Rust client (much faster + better stall recovery)
      - HF_HUB_DOWNLOAD_TIMEOUT=120
    args:
      - -c
      - |
        set -euo pipefail
        # huggingface-hub 1.14+ ships the `hf` CLI; the older `huggingface-cli`
        # was removed. hf_transfer dramatically speeds the download.
        pip install --quiet --no-cache-dir 'huggingface_hub>=1.14' 'hf_transfer'
        echo "Downloading ${_MODEL_ID} from HuggingFace..."
        # --max-workers 4 keeps stall blast radius bounded; hf_transfer
        # resumes partial files between retries.
        hf download ${_MODEL_ID} \
          --local-dir ${_LOCAL_DIR} \
          --max-workers 4 \
          --token "$$HF_TOKEN"
        echo "Download complete:"
        du -sh ${_LOCAL_DIR}

  - name: gcr.io/cloud-builders/gsutil
    args:
      - -m
      - rsync
      - -d
      - -r
      - ${_LOCAL_DIR}
      - gs://${_BUCKET_NAME}/${_MODEL_ID}/

options:
  logging: CLOUD_LOGGING_ONLY
  # Llama 3.1 8B is ~16 GB safetensors; bump disk + machine for a faster build.
  diskSizeGb: 100
  machineType: E2_HIGHCPU_8

# Total runtime ~10-15 min in the happy path. HF can rate-limit or stall on
# large model files, so the timeout is generous (60 min).
timeout: 3600s
