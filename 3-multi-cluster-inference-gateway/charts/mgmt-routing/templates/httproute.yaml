apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.inferencePoolName }}-default
  namespace: {{ .Values.gatewayNamespace }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
      kind: Gateway
  rules:
    - backendRefs:
        - group: networking.gke.io
          kind: GCPInferencePoolImport
          name: {{ .Values.inferencePoolName }}
          namespace: {{ .Values.inferenceNamespace }}
