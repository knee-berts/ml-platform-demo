# KSA bound (via Workload Identity) to the inference GSA in the foundation
# stack (1-infrastructure/inference-iam.tf::google_service_account.inference). The
# binding is keyed on this exact KSA name + namespace, so neither can change
# without also updating the WI member in inference-iam.tf.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.inferencePoolName }}
  namespace: {{ .Values.inferenceNamespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "inferenceServiceAccount is required" .Values.inferenceServiceAccount | quote }}
