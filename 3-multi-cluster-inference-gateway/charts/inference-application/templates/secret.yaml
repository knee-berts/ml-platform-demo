# HuggingFace token for gated model downloads (Llama 3.1).
# Sourced from Terraform variable TF_VAR_hf_token (also used by the
# weights-uploader Cloud Build via Secret Manager).
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: {{ .Values.inferenceNamespace }}
type: Opaque
stringData:
  token: {{ required "hfToken is required (set TF_VAR_hf_token)" .Values.hfToken | quote }}
