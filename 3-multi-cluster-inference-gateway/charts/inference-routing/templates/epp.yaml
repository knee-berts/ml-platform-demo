{{- $pool := .Values.inferencePoolName -}}
{{- $ns   := .Values.inferenceNamespace -}}
# EPP — rendered from the upstream inferencepool helm chart (gateway-api-inference-extension).
# Kept verbatim aside from namespace + pool name templating, so future drift can be
# diffed against `helm template` of the upstream chart.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $pool }}-metrics-reader-sa
  namespace: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $pool }}-epp
    app.kubernetes.io/version: "v1.4.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pool }}-metrics-reader-secret
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $pool }}-epp
    app.kubernetes.io/version: "v1.4.0"
  annotations:
    kubernetes.io/service-account.name: {{ $pool }}-metrics-reader-sa
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
data:
  default-plugins.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    featureGates:
    - "flowControl"
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    saturationDetector:
      queueDepthThreshold: {{ .Values.saturationQueueDepthThreshold }}
      kvCacheUtilThreshold: {{ .Values.saturationKvCacheUtilThreshold }}
    flowControl:
      maxBytes: 1000000000
      defaultRequestTTL: 30s
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
      - pluginRef: kv-cache-utilization-scorer
      - pluginRef: prefix-cache-scorer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: default-{{ $pool }}-metrics-reader
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $pool }}-default-epp
  labels:
    app.kubernetes.io/name: {{ $pool }}-epp
    app.kubernetes.io/version: "v1.4.0"
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default-{{ $pool }}-metrics-reader-role-binding
subjects:
- kind: ServiceAccount
  name: {{ $pool }}-metrics-reader-sa
  namespace: {{ $ns }}
roleRef:
  kind: ClusterRole
  name: default-{{ $pool }}-metrics-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $pool }}-default-epp
subjects:
- kind: ServiceAccount
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $pool }}-default-epp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $pool }}-metrics-reader-secret-read
  namespace: {{ $ns }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["{{ $pool }}-metrics-reader-secret"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $pool }}-epp
    app.kubernetes.io/version: "v1.4.0"
rules:
- apiGroups: ["inference.networking.x-k8s.io"]
  resources: ["inferenceobjectives"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["inference.networking.k8s.io"]
  resources: ["inferencepools"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gmp-system:collector:default-{{ $pool }}-metrics-reader-secret-read
  namespace: {{ $ns }}
roleRef:
  name: {{ $pool }}-metrics-reader-secret-read
  kind: Role
  apiGroup: rbac.authorization.k8s.io
subjects:
- name: collector
  namespace: gmp-system
  kind: ServiceAccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
subjects:
- kind: ServiceAccount
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $pool }}-epp
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $pool }}-epp
    app.kubernetes.io/version: "v1.4.0"
spec:
  selector:
    inferencepool: {{ $pool }}-epp
  ports:
    - name: grpc-ext-proc
      protocol: TCP
      port: 9002
    - name: http-metrics
      protocol: TCP
      port: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $pool }}-epp
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $pool }}-epp
    app.kubernetes.io/version: "v1.4.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      inferencepool: {{ $pool }}-epp
  template:
    metadata:
      labels:
        inferencepool: {{ $pool }}-epp
    spec:
      serviceAccountName: {{ $pool }}-epp
      terminationGracePeriodSeconds: 130
      containers:
      - name: epp
        image: {{ .Values.eppImage | quote }}
        imagePullPolicy: Always
        args:
        - --pool-name
        - {{ $pool }}
        - --pool-namespace
        - {{ $ns }}
        - --pool-group
        - "inference.networking.k8s.io"
        - --zap-encoder
        - "json"
        - --config-file
        - "/config/default-plugins.yaml"
        - "--v"
        - "1"
        - "--tracing"
        - "false"
        - --metrics-endpoint-auth=false
        ports:
        - name: grpc
          containerPort: 9002
        - name: grpc-health
          containerPort: 9003
        - name: metrics
          containerPort: 9090
        livenessProbe:
          grpc:
            port: 9003
            service: inference-extension
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 9003
            service: inference-extension
          periodSeconds: 2
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: plugins-config-volume
          mountPath: "/config"
      volumes:
      - name: plugins-config-volume
        configMap:
          name: {{ $pool }}-epp
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: {{ $pool }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $pool }}-epp
    app.kubernetes.io/version: "v1.4.0"
spec:
  endpoints:
  - port: metrics
    scheme: http
    interval: 10s
    path: /metrics
    authorization:
      type: Bearer
      credentials:
        secret:
          name: {{ $pool }}-metrics-reader-secret
          key: token
  selector:
    matchLabels:
      inferencepool: {{ $pool }}-epp
