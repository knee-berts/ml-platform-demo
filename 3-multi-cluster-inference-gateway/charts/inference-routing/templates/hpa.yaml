{{- if .Values.enableScaleFromZero }}
# Scale-from-zero spillover profile — wakes on EPP flow control queue depth
# while pods cold-start. Mirrors kueue/hpa-inference-west3.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-inference-hpa
  namespace: {{ .Values.inferenceNamespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.inferencePoolName }}
  minReplicas: 0
  maxReplicas: 6
  metrics:
    - type: Object
      object:
        describedObject:
          apiVersion: apps/v1
          kind: Deployment
          name: {{ .Values.inferencePoolName }}-epp
        metric:
          name: prometheus.googleapis.com|inference_extension_flow_control_queue_size|gauge
        target:
          type: AverageValue
          averageValue: "1"
    - type: Pods
      pods:
        metric:
          name: prometheus.googleapis.com|vllm:kv_cache_usage_perc|gauge
        target:
          type: AverageValue
          averageValue: "0.45"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- else }}
# Baseline profile — KV-cache only, min=2. Mirrors kueue/hpa-inference.yaml.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-inference-hpa
  namespace: {{ .Values.inferenceNamespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.inferencePoolName }}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Pods
      pods:
        metric:
          name: prometheus.googleapis.com|vllm:kv_cache_usage_perc|gauge
        target:
          type: AverageValue
          averageValue: "0.45"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
