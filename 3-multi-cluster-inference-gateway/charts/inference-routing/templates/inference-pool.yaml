apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: {{ .Values.inferencePoolName }}
  namespace: {{ .Values.inferenceNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.inferencePoolName }}-epp
    app.kubernetes.io/version: "v1.4.0"
  annotations:
    networking.gke.io/export: "True"
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      app: {{ .Values.inferencePoolName | quote }}
  endpointPickerRef:
    name: {{ .Values.inferencePoolName }}-epp
    port:
      number: 9002
