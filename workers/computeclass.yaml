# GPU Compute Class for the inference fleet.
#
# Priorities are tried top-to-bottom. Higher priorities win for new pods and
# also drive active migration: when a higher-priority option becomes available,
# pods are repacked back onto it.
#
# Priority 1 matches the existing Terraform-managed Blackwell pool by config.
# Priorities 2 and 3 rely on Node Auto-Provisioning (cluster_autoscaling.enabled
# + nvidia-l4 resource_limits in terraform/clusters.tf) to materialize an L4
# pool on demand.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: inference-gpu
spec:
  nodePoolAutoCreation:
    enabled: true

  priorities:
    # 1. Blackwell on-demand — matches the TF-managed g4 pool by config.
    #    Preferred when available; the demo's tuned image runs natively here.
    - machineType: g4-standard-48
      gpu:
        type: nvidia-rtx-pro-6000
        count: 1
        driverVersion: default
      spot: false

    # 2. L4 Spot — NAP provisions a g2 pool. Cheapest fallback when Blackwell
    #    is unavailable; pods may be preempted by Spot reclaim.
    - machineType: g2-standard-12
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: default
      spot: true

    # 3. L4 on-demand — final fallback when L4 Spot capacity is also unavailable.
    - machineType: g2-standard-12
      gpu:
        type: nvidia-l4
        count: 1
        driverVersion: default
      spot: false

  # Don't block pod scheduling if every priority is unsatisfiable; let the
  # autoscaler keep retrying so we recover when capacity returns.
  whenUnsatisfiable: ScaleUpAnyway

  # Periodically repack to higher-priority options when they free up
  # (e.g. shift from L4 back to Blackwell once Blackwell capacity returns).
  activeMigration:
    optimizeRulePriority: true
